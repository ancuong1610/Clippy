# ---- Posting ----
# backend "composio": YouTube auto-upload (free, COMPOSIO_API_KEY in .env); TikTok/Instagram get a
#                     ready-to-paste caption file (manual_tiktok.txt / manual_instagram.txt) next to the video.
# backend "upload-post": all three automatic (paid, UPLOAD_POST_API_KEY + user below).
[post]
backend = "composio"
composio_user = "stream-chaos-clips"
user = ""                               # Upload-Post profile name (only for backend = "upload-post")
platforms = ["tiktok", "youtube", "instagram"]
queue_dir = "queue"
min_queue_score = 50                    # clips below this moment score can't enter the queue (--force overrides)
description = "GTA 6 launch stream highlights"
tags = ["GTA6", "GTA", "Shorts"]
credit_template = "🎥 {streamer} — full stream on their channel"
youtube_privacy = "public"
# tiktok_privacy = "PUBLIC_TO_EVERYONE"
# auto_approve_min_score = 70           # OFF by default: every post needs `clipfarm queue approve`
