# clipfarm config — edit channels, then: uv run clipfarm run
output_dir = "clips"     # clips/<channel>/<time>_r<ratio>.mp4 + .json, clips/events.jsonl
buffer_dir = "buffer"    # rolling 10s segments, auto-deleted after buffer_minutes

[clip]
length = "auto"          # auto = 30s before + 8s after spike | "15-30" (20+6) | "30-60" (40+12)
# pre_s = 30             # optional explicit override of the preset
# post_s = 8
min_score = 35           # signal gate (chat 60 + audio 40): only these get sent to the AI judge
keep_low = false         # false: clips that don't make the bar are deleted (scores logged in clips/events.jsonl)
segment_s = 10
game = 'grand theft auto vi|\bgta ?(6|vi)\b'   # only record streams playing this (category + title, regex)
buffer_minutes = 15
quality = "720p60,720p,best"  # 720p keeps 10 streams under ~45 Mbps; Shorts are 1080x1920 anyway
chat_video_offset_s = 0  # +N if our video arrives N s later than chat (tune after first clips)

[judge]                  # AI watches each candidate (frames + chat) and rates it 0-100
enabled = true           # benchmark: xQc's GTA 6 seaplane crash = 95; gym/menus/NPC talk ~ 45
min_hype = 90            # highlight bar: below this a clip is dropped

[detector]               # defaults shown; can be overridden per channel with [channel.detector]
ratio = 3.0              # chat must be >= 3x its own normal
min_score = 8.0
min_unique = 5
cooldown_s = 45
warmup_s = 60

