# ---- Posting ----
# YouTube uploads automatically through Composio (free, COMPOSIO_API_KEY in .env). TikTok / Instagram
# get a ready-to-paste caption file (manual_tiktok.txt / manual_instagram.txt) next to the video.
[post]
composio_user = "stream-chaos-clips"   # Composio user id that owns the connected YouTube account
platforms = ["tiktok", "youtube", "instagram"]
queue_dir = "queue"
min_queue_score = 50                    # clips below this moment score can't enter the queue (--force overrides)
description = "GTA 6 launch stream highlights"
tags = ["GTA6", "GTA", "Shorts"]
credit_template = "🎥 {streamer} — full stream on their channel"
youtube_privacy = "public"
# tiktok_privacy = "PUBLIC_TO_EVERYONE"
context = "GTA 6 launch stream"         # tells the AI what the stream is about (titles, hook)
# ---- Auto-post during `clipfarm run` (approved 2026-11-18 for the GTA 6 launch) ----
# Highlight clips (score >= auto_post_min_score) are edited and uploaded to YouTube with no human step,
# unless the AI flags a risk (music, sexual, hate, off-topic, ...) or the hourly limit is reached: those wait in
# queue/pending/ for `clipfarm queue approve`. Log: queue/autopost.jsonl. Comment out to turn off.
auto_post_min_score = 60            # GTA 6 launch: ~3 candidates/hour at 60 (70 gave ~1)
auto_post_max_per_hour = 3
