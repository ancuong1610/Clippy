[project]
name = "clipfarm"
version = "0.1.0"
description = "Chat-spike auto-clipper: watches Twitch/YouTube streams, catches hype moments, renders vertical Shorts and posts them."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "composio>=0.33.0",
    "httpx>=0.28.1",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "streamlink>=8.6.3",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
clipfarm = "clipfarm:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
